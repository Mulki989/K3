.callout{border-radius:12px;padding:12px 16px;background:var(--amber-soft);color:#4A3200}
.callout.blue{background:var(--blue-soft);color:#123B69}
.sim{background:#FBFAF7;border:1px solid var(--line2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sim svg{width:100%;height:auto;display:block}
.animv input[type=range],.sim input[type=range]{width:100%;accent-color:var(--blue);height:28px}
.animv .ctl,.sim .ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px}
.animv .ctl label,.sim .ctl label{display:flex;flex-direction:column;font-size:13px;font-weight:700}
.animv .ctl label span,.sim .ctl label span{display:flex;justify-content:space-between}
.cek{border:2px solid var(--blue-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cek .q{font-weight:700}
.opt{min-height:46px;text-align:left;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:600;cursor:pointer;width:100%}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}.opt.no{border-color:var(--red);background:var(--red-soft)}
.dock{flex:none}
.narr{background:#fff;border-top:1px solid var(--line);padding:8px 18px}
.cap{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:36px 1fr 36px;grid-template-rows:auto auto;align-items:center;column-gap:10px}
.cap p{margin:0;font-size:15px;line-height:1.5;color:#2A333F;height:3em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:center}
.cap p.fade{animation:capin .35s ease}
@keyframes capin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cap p.fade{animation:none}}
.capb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.capb:disabled{opacity:.3;cursor:default}
.capm{grid-column:2;display:flex;justify-content:center;gap:10px;font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.captag{color:#8A5A00}
.pbar{background:var(--ink);color:#fff;padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.play{width:48px;height:48px;border-radius:24px;border:0;background:var(--amber);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.prog{flex:1 1 120px;display:flex;align-items:center;gap:10px;min-width:0;font-size:12px;color:#D5DAE1}
.prog input{flex:1;accent-color:var(--amber)}
.pbar .ctl2{min-width:46px;height:40px;border-radius:8px;border:1px solid var(--dark2);background:transparent;color:#fff;font-weight:700;cursor:pointer;padding:0 10px}
.pbar .ctl2.on{background:#fff;color:var(--ink)}
.pbar select.ctl2 option{color:var(--ink)}
.pbar .nav{display:flex;gap:8px;margin-left:auto}
.pbar .btn.ghost{background:transparent;color:#fff;border-color:var(--dark2)}
/* kuis */
.qlayout{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.qmain{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:14px}
.qside{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:14px}
.qtext{font-size:17px;line-height:1.6;font-weight:600}
.navgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.navgrid button{height:44px;border-radius:8px;border:2px solid #ECEAE3;background:#ECEAE3;font-weight:800;cursor:pointer}
.navgrid button.ans{background:var(--blue);border-color:var(--blue);color:#fff}
.navgrid button.flag{border-color:var(--amber)}
.navgrid button.cur{background:var(--ink);border-color:var(--ink);color:#fff}
.navgrid button.ok{background:var(--green);border-color:var(--green);color:#fff}.navgrid button.no{background:var(--red);border-color:var(--red);color:#fff}
.bsrow,.jrow,.urow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bsrow .s,.urow .s{flex:1 1 260px;min-width:0}
.seg{display:inline-flex;border:1px solid #C9C6BC;border-radius:9px;overflow:hidden}
.seg button{min-width:72px;height:42px;border:0;background:#fff;font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.jrow .l{flex:0 1 200px;font-weight:700}
.jrow select{flex:1 1 280px}
.urow .ub{width:44px;height:40px;border-radius:8px;border:1px solid #C9C6BC;background:#fff;cursor:pointer;font-size:18px}
.urow .n{width:28px;height:28px;border-radius:7px;background:var(--blue-soft);color:var(--blue);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pemb{border-radius:12px;background:#FBFAF7;border:1px solid var(--line2);padding:14px 16px}
.pemb ol{margin:6px 0 0;padding-left:22px}.pemb li{margin:4px 0}
.timer{display:flex;align-items:center;gap:8px;background:var(--amber);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{background:var(--red);color:#fff}
#wm{position:fixed;inset:-50%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:90px 40px;transform:rotate(-24deg);pointer-events:none;z-index:150;align-content:start}
#wm span{font-size:20px;font-weight:800;color:rgba(23,32,43,.08);white-space:nowrap}
#shield{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:300;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;font-weight:700;line-height:1.5}
.exam,body.examining{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.examining input,body.examining textarea{user-select:text;-webkit-user-select:text;-webkit-touch-callout:none}
body.examining img,body.examining svg{pointer-events:none;-webkit-user-drag:none}
@media print{body.examining *{display:none!important}}
/* tabel */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-top:1px solid var(--line2);text-align:left;vertical-align:middle}
th{background:#FBFAF7;font-weight:800;border-top:0;white-space:nowrap}
td.c,th.c{text-align:center}
.sw{width:50px;height:28px;border-radius:14px;border:0;background:#A8A59B;position:relative;cursor:pointer;vertical-align:middle}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.sw[aria-pressed=true]{background:var(--green)}.sw[aria-pressed=true]::after{left:25px}
.obebar{position:relative;height:22px;background:#ECEAE3;border-radius:6px;flex:1 1 260px}
.obebar>i{display:block;height:100%;border-radius:6px}
.obebar>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.side{display:flex;flex-wrap:wrap;min-height:100vh}
.side nav{flex:1 1 210px;background:var(--ink);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side nav button{min-height:44px;text-align:left;padding:0 12px;border-radius:8px;border:0;background:transparent;color:#fff;font-weight:700;cursor:pointer}
.side nav button.on{background:var(--amber);color:var(--ink)}
.side main{flex:999 1 640px;min-width:0;padding:22px;display:flex;flex-direction:column;gap:16px}
@media (max-width:640px){.cap{grid-template-columns:30px 1fr 30px;column-gap:6px}.capb{width:30px;height:30px;font-size:18px}.cap p{font-size:14px;height:4.5em;-webkit-line-clamp:3}.narr{padding:6px 10px}.wrap,.stage{padding:12px}.pbar{padding:8px 10px;gap:8px}.prog span{display:none}.slide{padding:16px}.slide h1{font-size:21px}h1{font-size:21px}.pbar .nav{width:100%}.pbar .nav .btn{flex:1}}
</style>
</head>
